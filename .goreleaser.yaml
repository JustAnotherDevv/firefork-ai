# GoReleaser v2 config — see https://goreleaser.com
#
# Fires on git tag push via .github/workflows/release.yml. Produces a
# single tarball per (os, arch) carrying all five binaries (firefork,
# seed-template, fork, bench, firefork-server), a sha256 checksum file,
# a CycloneDX SBOM, and Sigstore keyless signatures via cosign.
#
# To dry-run locally:
#   goreleaser release --snapshot --clean --skip=publish,sign
version: 2

project_name: firefork

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: firefork
    binary: firefork
    main: ./cmd/firefork
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos: [linux]
    goarch: [amd64, arm64]

  - id: seed-template
    binary: seed-template
    main: ./cmd/seed-template
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos: [linux]
    goarch: [amd64, arm64]

  - id: fork
    binary: fork
    main: ./cmd/fork
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos: [linux]
    goarch: [amd64, arm64]

  - id: bench
    binary: bench
    main: ./cmd/bench
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos: [linux]
    goarch: [amd64, arm64]

  - id: firefork-server
    binary: firefork-server
    main: ./cmd/firefork-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: default
    # Bundle all five binaries together so the tarball matches what we
    # already ship in v0.1.x release notes ("five statically-linked
    # binaries"). One archive per (os, arch).
    ids:
      - firefork
      - seed-template
      - fork
      - bench
      - firefork-server
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - CHANGELOG.md
      - configs/template_*.yaml

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.cdx.json"

# Sigstore keyless signing. Requires id-token: write on the GHA job.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--oidc-issuer=https://token.actions.githubusercontent.com"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github-native
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore\\(deps\\):"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: JustAnotherDevv
    name: firefork-ai
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## firefork {{ .Tag }}
  footer: |
    ---

    Verify a release artifact:
    ```sh
    cosign verify-blob \
      --certificate firefork-{{ .Version }}-linux-amd64.tar.gz.pem \
      --signature firefork-{{ .Version }}-linux-amd64.tar.gz.sig \
      --certificate-identity-regexp 'https://github.com/JustAnotherDevv/firefork-ai/' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      firefork-{{ .Version }}-linux-amd64.tar.gz
    ```

snapshot:
  version_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"
